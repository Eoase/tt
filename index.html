<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>سجل الحضور والغياب</title>

<!-- ربط ملف الـ PWA manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<!-- أيقونات التطبيق -->
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --present:#16a34a;
    --absent:#dc2626;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    background:var(--primary);
    color:#fff;
    padding:16px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:5;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header .back-btn{
    background:rgba(255,255,255,.2);
    border:none;
    color:#fff;
    font-size:18px;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    display:none;
  }
  header h1{
    font-size:18px;
    margin:0;
    flex:1;
    text-align:center;
  }
  .container{
    max-width:480px;
    margin:0 auto;
    padding:16px;
    padding-bottom:100px;
  }
  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  input[type=text]{
    flex:1;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    background:var(--card);
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--primary);
  }
  button.primary{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.primary:active{background:var(--primary-dark);}
  .list-item{
    background:var(--card);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }
  .list-item .name{
    font-size:16px;
    font-weight:600;
  }
  .list-item .arrow{color:var(--muted);font-size:18px;}
  .empty{
    text-align:center;
    color:var(--muted);
    margin-top:40px;
    font-size:15px;
  }
  .student-card{
    background:var(--card);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .student-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .student-name{
    font-size:16px;
    font-weight:600;
  }
  .del-btn{
    background:none;
    border:none;
    color:#b91c1c;
    font-size:18px;
    cursor:pointer;
    padding:4px 8px;
  }
  .status-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .checkbox{
    width:22px;
    height:22px;
    border:2px solid var(--muted);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:14px;
    color:#fff;
  }
  .checkbox.checked-present{background:var(--present);border-color:var(--present);}
  .checkbox.checked-absent{background:var(--absent);border-color:var(--absent);}
  .status-label{
    font-size:14px;
    color:var(--muted);
  }
  .status-label.present{color:var(--present);font-weight:600;}
  .status-label.absent{color:var(--absent);font-weight:600;}

  /* Modal for choosing status */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:20;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:16px 16px 0 0;
    padding:10px;
    animation:slideup .2s ease-out;
  }
  @keyframes slideup{
    from{transform:translateY(100%);}
    to{transform:translateY(0);}
  }
  .sheet-title{
    text-align:center;
    padding:10px;
    color:var(--muted);
    font-size:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:6px;
  }
  .sheet-option{
    padding:16px;
    text-align:center;
    font-size:17px;
    border-radius:10px;
    cursor:pointer;
  }
  .sheet-option.present{color:var(--present);}
  .sheet-option.absent{color:var(--absent);}
  .sheet-option:active{background:var(--bg);}
  .sheet-cancel{
    margin-top:6px;
    padding:16px;
    text-align:center;
    font-size:16px;
    color:var(--muted);
    border-top:8px solid var(--bg);
    cursor:pointer;
  }
  .fab-space{height:20px;}
</style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn">→</button>
  <h1 id="pageTitle">📚 الفصول الدراسية</h1>
  <span style="width:34px"></span>
</header>

<div class="container">

  <!-- شاشة الفصول -->
  <div id="classesView">
    <div class="add-row">
      <input type="text" id="newClassInput" placeholder="اسم الفصل (مثال: الأول أ)">
      <button class="primary" onclick="addClass()">➕ إضافة فصل</button>
    </div>
    <div id="classesList"></div>
    <div class="empty" id="classesEmpty">لا يوجد فصول بعد، ابدأ بإضافة فصل جديد</div>
  </div>

  <!-- شاشة الطلاب داخل فصل -->
  <div id="studentsView" style="display:none;">
    <div class="add-row">
      <input type="text" id="newStudentInput" placeholder="اسم الطالب">
      <button class="primary" onclick="addStudent()">➕ إضافة</button>
    </div>
    <div id="studentsList"></div>
    <div class="empty" id="studentsEmpty">لا يوجد طلاب بعد، ابدأ بإضافة طالب</div>
  </div>

</div>

<!-- نافذة اختيار الحالة -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-title">اختر حالة الطالب</div>
    <div class="sheet-option present" onclick="setStatus('present')">✅ حاضر</div>
    <div class="sheet-option absent" onclick="setStatus('absent')">❌ غائب</div>
    <div class="sheet-cancel" onclick="closeOverlay()">إلغاء</div>
  </div>
</div>

<script>
// ---------- تخزين البيانات محلياً (يبقى بعد إغلاق التطبيق) ----------
const STORAGE_KEY = 'attendance_app_data_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { classes: [] };
  }catch(e){
    return { classes: [] };
  }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();
let currentClassId = null;
let pendingStudentId = null; // للطالب الذي يتم اختيار حالته حالياً

// ---------- أدوات مساعدة ----------
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function findClass(id){
  return data.classes.find(c => c.id === id);
}

// ---------- شاشة الفصول ----------
function renderClasses(){
  const list = document.getElementById('classesList');
  const empty = document.getElementById('classesEmpty');
  list.innerHTML = '';
  if(data.classes.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  data.classes.forEach(cls => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.onclick = () => openClass(cls.id);
    div.innerHTML = `<span class="name">🏫 ${escapeHtml(cls.name)}</span><span class="arrow">‹</span>`;
    list.appendChild(div);
  });
}

function addClass(){
  const input = document.getElementById('newClassInput');
  const name = input.value.trim();
  if(!name) return;
  data.classes.push({ id: uid(), name: name, students: [] });
  input.value = '';
  saveData();
  renderClasses();
}

// ---------- شاشة الطلاب ----------
function openClass(classId){
  currentClassId = classId;
  const cls = findClass(classId);
  document.getElementById('classesView').style.display = 'none';
  document.getElementById('studentsView').style.display = 'block';
  document.getElementById('pageTitle').textContent = '🏫 ' + cls.name;
  document.getElementById('backBtn').style.display = 'inline-block';
  renderStudents();
}

function goBackToClasses(){
  currentClassId = null;
  document.getElementById('studentsView').style.display = 'none';
  document.getElementById('classesView').style.display = 'block';
  document.getElementById('pageTitle').textContent = '📚 الفصول الدراسية';
  document.getElementById('backBtn').style.display = 'none';
  renderClasses();
}
document.getElementById('backBtn').addEventListener('click', goBackToClasses);

function renderStudents(){
  const cls = findClass(currentClassId);
  const list = document.getElementById('studentsList');
  const empty = document.getElementById('studentsEmpty');
  list.innerHTML = '';
  if(!cls.students.length){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  cls.students.forEach(st => {
    const card = document.createElement('div');
    card.className = 'student-card';

    const checkClass = st.status === 'present' ? 'checked-present' : st.status === 'absent' ? 'checked-absent' : '';
    const checkContent = st.status === 'present' ? '✓' : st.status === 'absent' ? '✕' : '';
    const labelClass = st.status === 'present' ? 'present' : st.status === 'absent' ? 'absent' : '';
    const labelText = st.status === 'present' ? 'حاضر' : st.status === 'absent' ? 'غائب' : 'لم يُسجَّل بعد';

    card.innerHTML = `
      <div class="student-top">
        <span class="student-name">👤 ${escapeHtml(st.name)}</span>
        <button class="del-btn" onclick="deleteStudent('${st.id}')">🗑️</button>
      </div>
      <div class="status-row">
        <div class="checkbox ${checkClass}" onclick="openOverlay('${st.id}')">${checkContent}</div>
        <span class="status-label ${labelClass}">${labelText}</span>
      </div>
    `;
    list.appendChild(card);
  });
}

function addStudent(){
  const input = document.getElementById('newStudentInput');
  const name = input.value.trim();
  if(!name) return;
  const cls = findClass(currentClassId);
  cls.students.push({ id: uid(), name: name, status: null });
  input.value = '';
  saveData();
  renderStudents();
}

function deleteStudent(studentId){
  const cls = findClass(currentClassId);
  cls.students = cls.students.filter(s => s.id !== studentId);
  saveData();
  renderStudents();
}

// ---------- نافذة اختيار الحضور / الغياب ----------
function openOverlay(studentId){
  pendingStudentId = studentId;
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){
  pendingStudentId = null;
  document.getElementById('overlay').classList.remove('show');
}
function setStatus(status){
  const cls = findClass(currentClassId);
  const st = cls.students.find(s => s.id === pendingStudentId);
  if(st){
    // لو اختار نفس الحالة اللي كانت محفوظة، نلغيها (toggle)
    st.status = (st.status === status) ? null : status;
    saveData();
  }
  closeOverlay();
  renderStudents();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// السماح بالإضافة بالضغط على Enter
document.getElementById('newClassInput').addEventListener('keypress', e => {
  if(e.key === 'Enter') addClass();
});
document.getElementById('newStudentInput').addEventListener('keypress', e => {
  if(e.key === 'Enter') addStudent();
});

// ---------- البداية ----------
renderClasses();

// ---------- تسجيل Service Worker (لتشغيل التطبيق بدون إنترنت) ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker مسجل بنجاح'))
      .catch(err => console.log('فشل تسجيل Service Worker:', err));
  });
}
</script>
</body>
</html>
